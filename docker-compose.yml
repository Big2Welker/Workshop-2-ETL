version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:3.1.8-python3.10
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - AIRFLOW__CORE__FERNET_KEY=fLJTSG37YolLbAQFEV-3HNwxPV__tgTZcx8OjnJiEf8=
      - AIRFLOW__API_AUTH__JWT_SECRET=jRbS5t7fnHyPWW6KayB-FLredqvQOozwNvOnjkHZ6h0=
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql great_expectations pyarrow pymysql
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Inicializando base de datos de Airflow..."
        airflow db migrate
        echo "¡Airflow inicializado exitosamente!"
    restart: "no"

  airflow-webserver:
    image: apache/airflow:3.1.8-python3.10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
      - AIRFLOW__CORE__FERNET_KEY=fLJTSG37YolLbAQFEV-3HNwxPV__tgTZcx8OjnJiEf8=
      - AIRFLOW__API_AUTH__JWT_SECRET=jRbS5t7fnHyPWW6KayB-FLredqvQOozwNvOnjkHZ6h0=
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
      - AIRFLOW_CONN_MYSQL_DW=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/music_dw
      - PYTHONPATH=/opt/airflow
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql great_expectations pyarrow pymysql
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./docs:/opt/airflow/docs
      - ./src:/opt/airflow/src
    command: api-server
    restart: always

  airflow-scheduler:
    image: apache/airflow:3.1.8-python3.10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
      - AIRFLOW__CORE__FERNET_KEY=fLJTSG37YolLbAQFEV-3HNwxPV__tgTZcx8OjnJiEf8=
      - AIRFLOW__API_AUTH__JWT_SECRET=jRbS5t7fnHyPWW6KayB-FLredqvQOozwNvOnjkHZ6h0=
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
      - AIRFLOW_CONN_MYSQL_DW=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/music_dw
      - PYTHONPATH=/opt/airflow
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql great_expectations pyarrow pymysql
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./docs:/opt/airflow/docs
      - ./src:/opt/airflow/src
    command: scheduler
    restart: always

  airflow-dag-processor:
    image: apache/airflow:3.1.8-python3.10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - AIRFLOW__CORE__FERNET_KEY=fLJTSG37YolLbAQFEV-3HNwxPV__tgTZcx8OjnJiEf8=
      - AIRFLOW__API_AUTH__JWT_SECRET=jRbS5t7fnHyPWW6KayB-FLredqvQOozwNvOnjkHZ6h0=
      - PYTHONPATH=/opt/airflow
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql great_expectations pyarrow pymysql
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
    command: dag-processor
    restart: always

volumes:
  mysql_data: